[package]
name = "goalkeeper"
authors = [ "Finn Bear" ]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DoS and DDoS mitigation utilities"
repository = "https://github.com/finnbear/goalkeeper"
exclude = ["fuzz/"]

[dependencies]
log = "0.4.17"
fxhash = "0.2.1"
socket2 = { version = "0.5.8", features = ["all"] }
# `SO_MAX_PACING_RATE` and `TCP_WINDOW_CLAMP`, which `socket2` does not wrap.
libc = "0.2"
async-task = "4.7"
axum = { version = "0.8.1", default-features = false, optional = true }
# TODO: https://github.com/robertwayne/axum-tws/pull/6
axum-tws = { version = "0.6", git = "https://github.com/finnbear/axum-tws", branch = "executor", features = ["http2"], optional = true }
# `GovernedSocket` forwards the traits `WebSocket` is driven through, which
# `Deref` cannot. Already in the tree via `axum-tws`.
futures-core = { version = "0.3", optional = true }
futures-sink = { version = "0.3", optional = true }
arc-swap = { version = "1.7", optional = true }
hyper = { version = "1.11", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "server-graceful", "service"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
tokio = { version = "1.50", default-features = false, features = ["net", "rt", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tower = { version = "0.5", optional = true }
pin-project = "1.1"
wtransport = { version = "0.7.2", default-features = false, features = ["quinn", "ring"], optional = true }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http2"] }
# The IO adapter and executor a `hyper` client needs. Already in the tree via
# the `http` feature.
hyper-util = { version = "0.1.20", features = ["tokio", "client"] }
wtransport = { version = "0.7.2", features = ["dangerous-configuration", "self-signed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
env_logger = "0.11.8"
futures-util = "0.3.31"
rand = "0.8.4"
# `rt-multi-thread` for `examples/ddos`, which runs the flood on a runtime of
# its own so it is not sharing a thread with the server it is attacking.
tokio = { version = "1.50", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "io-util"], default-features = false }

[features]
default = []
http = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tower"]
tls = ["http", "dep:rustls", "dep:tokio-rustls", "dep:arc-swap"]
web_socket = ["http", "dep:axum-tws", "dep:futures-core", "dep:futures-sink"]
web_transport = ["tls", "dep:wtransport"]

[[example]]
name = "ddos"
required-features = ["web_socket"]

[[bench]]
name = "bandwidth"
harness = false
required-features = ["web_socket", "web_transport"]

[[bench]]
name = "upload"
harness = false
required-features = ["http"]

[[bench]]
name = "http1"
harness = false
required-features = ["http"]

[[bench]]
name = "http2"
harness = false
required-features = ["http"]

[[bench]]
name = "web_socket"
harness = false
required-features = ["web_socket"]

[[bench]]
name = "web_transport"
harness = false
required-features = ["web_transport"]

[[bench]]
name = "executor"
harness = false

[package.metadata.docs.rs]
all-features = true
